name: NAV3D CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ros2-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ROS 2 Jazzy build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: ubuntu:noble

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Resolve dependency manifest path
        id: dependency_manifest
        shell: bash
        run: |
          echo "url=file://${GITHUB_WORKSPACE}/.github/dependencies.repos" \
            >> "${GITHUB_OUTPUT}"

      - name: Set up ROS 2
        uses: ros-tooling/setup-ros@v0.7
        with:
          required-ros-distributions: jazzy

      - name: Install dependencies, build, and test
        id: ros_ci
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy
          package-name: >-
            px4_msgs
            nav3d_msgs
            nav3d_common
            nav3d_util
            nav3d_core
            nav3d_behavior_tree
            nav3d_planner
            nav3d_planner_plugin_moveit
            nav3d_controller
            nav3d_bt_navigator
            nav3d_lifecycle_manager
            nav3d_px4_adapter
            nav3d_gz_bridge
            nav3d_bringup
          vcs-repo-file-url: ${{ steps.dependency_manifest.outputs.url }}
          coverage-result: false

      - name: Show detailed test results
        if: always()
        shell: bash
        env:
          ROS_WORKSPACE: ${{ steps.ros_ci.outputs.ros-workspace-directory-name }}
        run: |
          if [[ -d "${ROS_WORKSPACE}/build" ]]; then
            colcon test-result \
              --test-result-base "${ROS_WORKSPACE}/build" \
              --verbose
          else
            echo "No colcon build directory was created."
          fi

      - name: Upload colcon logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: colcon-logs
          path: ros_ws/log
          if-no-files-found: warn
          retention-days: 14

  takeoff-test:
    name: Takeoff test
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out Nav3D pull request
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out simulation workspace
        uses: actions/checkout@v7
        with:
          repository: saviodp7/nav3d_sim
          ref: ${{ (github.head_ref || github.ref_name) == 'refactor/migrate-on-jazzy-with-gazebo-harmonic' && 'refactor/migrate-on-jazzy-with-gazebo-harmonic' || 'main' }}
          path: nav3d_sim
          persist-credentials: false

      - name: Check out Nav3D pull request into simulation workspace
        uses: actions/checkout@v7
        with:
          path: nav3d_sim/ros2_ws/src/nav3d
          persist-credentials: false

      - name: Check out drone description and MoveIt configuration
        uses: actions/checkout@v7
        with:
          repository: saviodp7/x500_nav3d
          ref: a0c1bc3f2dca0969fbdbf9249a0bae93fa025b88
          path: nav3d_sim/ros2_ws/src/x500_nav3d
          persist-credentials: false

      - name: Verify the Nav3D revision under test
        shell: bash
        run: |
          test "$(git -C nav3d_sim/ros2_ws/src/nav3d rev-parse HEAD)" = "$(git rev-parse HEAD)"

      - name: Build simulation image
        shell: bash
        run: docker build --tag nav3d-ci --file nav3d_sim/docker/Dockerfile nav3d_sim

      - name: Run automatic takeoff in the default world
        shell: bash
        run: |
          set -o pipefail
          mkdir -p nav3d_sim/ros2_ws/log/system_tests
          docker run --rm --shm-size=1g \
            --env LIBGL_ALWAYS_SOFTWARE=1 \
            --env EGL_PLATFORM=surfaceless \
            --volume "${GITHUB_WORKSPACE}/nav3d_sim:/workspaces/nav3d_sim" \
            --workdir /workspaces/nav3d_sim \
            nav3d-ci \
            bash /workspaces/nav3d_sim/ros2_ws/src/nav3d/.github/scripts/run_takeoff_baseline.sh \
            2>&1 | tee nav3d_sim/ros2_ws/log/system_tests/takeoff_test_ci.log

      - name: Upload report and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: takeoff-test
          path: |
            nav3d_sim/ros2_ws/log/system_tests/takeoff_test_ci.json
            nav3d_sim/ros2_ws/log/system_tests/takeoff_test_ci.log
            nav3d_sim/ros2_ws/log/system_tests/ros_logs/
            nav3d_sim/PX4-Autopilot/build/px4_sitl_default/src/modules/simulation/gz_bridge/log/**/*.ulg
          if-no-files-found: warn
          retention-days: 14
