name: NAV3D CI

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nav3d-ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, unit tests and takeoff
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 1. Build PX4 and Nav3D
        shell: bash
        run: |
          set -euo pipefail
          docker build --tag nav3d-ci --file docker/Dockerfile .
          docker run --rm --shm-size=1g \
            --volume "${GITHUB_WORKSPACE}:/workspaces/nav3d" \
            --workdir /workspaces/nav3d \
            nav3d-ci \
            bash /workspaces/nav3d/.github/scripts/build_ci.sh

      - name: 2. Run Nav3D unit tests
        shell: bash
        run: |
          docker run --rm --shm-size=1g \
            --volume "${GITHUB_WORKSPACE}:/workspaces/nav3d" \
            --workdir /workspaces/nav3d \
            nav3d-ci \
            bash /workspaces/nav3d/.github/scripts/run_unit_tests.sh

      - name: 3. Run takeoff integration test
        shell: bash
        run: |
          docker run --rm --shm-size=1g \
            --env LIBGL_ALWAYS_SOFTWARE=1 \
            --env EGL_PLATFORM=surfaceless \
            --volume "${GITHUB_WORKSPACE}:/workspaces/nav3d" \
            --workdir /workspaces/nav3d \
            nav3d-ci \
            bash -c '
              set -eo pipefail
              mkdir -p log/system_tests
              bash /workspaces/nav3d/.github/scripts/run_takeoff_test.sh \
                2>&1 | tee log/system_tests/takeoff_test_ci.log
            '

      - name: Upload build and test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nav3d-ci
          path: |
            log/
            PX4-Autopilot/build/px4_sitl_default/rootfs/log/**/*.ulg
          if-no-files-found: warn
          retention-days: 14
